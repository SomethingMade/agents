<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourierGo | Agent Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Core Layout */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f4f4f5; color: #18181b; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; padding: 24px; }
        .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .brand i { color: #3b82f6; }
        .nav-item { padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item.active { background: #18181b; border-left: 3px solid #3b82f6; }
        .nav-item:hover:not(.active) { background: #18181b; }
        
        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        
        /* Card & Forms */
        .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e4e4e7; margin-bottom: 24px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: #18181b; border-bottom: 1px solid #f1f1f4; padding-bottom: 12px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { padding: 12px 16px; border: 2px solid #e4e4e7; border-radius: 10px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
        .form-control:focus { border-color: #18181b; }
        
        /* Submit Button */
        .btn-submit { width: 100%; padding: 16px; background: #3b82f6; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-submit:hover { background: #2563eb; }
        .btn-submit:disabled { background: #a1a1aa; cursor: not-allowed; }

        /* Auth Overlay */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-box { text-align: center; max-width: 300px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <div style="font-size: 40px; margin-bottom: 20px;"><i class="fa-solid fa-user-shield"></i></div>
        <h2 style="margin-bottom: 10px;">Agent Portal</h2>
        <p style="color: #71717a; font-size: 14px; margin-bottom: 24px;">Please sign in with your authorized agent account.</p>
        <button onclick="signInAgent()" style="width: 100%; padding: 14px; background: #18181b; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Sign in with Google</button>
    </div>
</div>

<div class="sidebar">
    <div class="brand"><i class="fa-solid fa-truck-fast"></i> CourierGo Agent</div>
    <div class="nav-item active"><i class="fa-solid fa-cash-register"></i> Walk-in Dispatch</div>
    <div class="nav-item"><i class="fa-solid fa-box-open"></i> Daily Log</div>
    <div style="margin-top: auto;" class="nav-item" onclick="signOutAgent()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</div>
</div>

<div class="main-content">
    <div class="header">
        <h1>New Walk-in Order</h1>
        <div id="agent-info" style="font-size: 14px; font-weight: 600; color: #52525b;">Agent: Loading...</div>
    </div>

    <div class="card">
        <div class="card-title">1. Sender Details (Walk-in Client)</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="sender-name" class="form-control" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="sender-phone" class="form-control" placeholder="060 123 4567">
            </div>
            <div class="form-group">
                <label>Email Address (Optional)</label>
                <input type="email" id="sender-email" class="form-control" placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label>Origin Branch</label>
                <input type="text" id="origin-branch" class="form-control" value="CourierGo Pretoria Branch" disabled>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">2. Destination Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Recipient Name</label>
                <input type="text" id="receiver-name" class="form-control" placeholder="Jane Smith">
            </div>
            <div class="form-group">
                <label>Recipient Phone</label>
                <input type="tel" id="receiver-phone" class="form-control" placeholder="071 987 6543">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Delivery Address</label>
                <input type="text" id="delivery-address" class="form-control" placeholder="Enter full delivery address">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">3. Package & Payment</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Package Size</label>
                <select id="package-size" class="form-control">
                    <option value="Document|40">Document (R40 Base)</option>
                    <option value="Small Parcel|65">Small Parcel (R65 Base)</option>
                    <option value="Medium Box|110">Medium Box (R110 Base)</option>
                    <option value="Large Freight|180">Large Freight (R180 Base)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Payment Collected</label>
                <select id="payment-method" class="form-control">
                    <option value="Counter - Cash">Cash at Counter</option>
                    <option value="Counter - Card">Card Machine at Counter</option>
                </select>
            </div>
        </div>
        
        <div style="margin-top: 24px;">
            <button class="btn-submit" id="dispatch-btn" onclick="processWalkInOrder()">
                <i class="fa-solid fa-paper-plane"></i> Dispatch to Shipday
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Reusing existing CourierGo Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
        authDomain: "newstart-64c43.firebaseapp.com",
        databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
        projectId: "newstart-64c43",
        storageBucket: "newstart-64c43.firebasestorage.app",
        messagingSenderId: "941619830061",
        appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
    };

    const SHIPDAY_KEY = "K5a8wQJF3f.az2zfrhgzwxK9JONI2y8";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentAgent = null;

    // --- Authentication ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentAgent = user;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('agent-info').textContent = `Agent: ${user.displayName}`;
        } else {
            currentAgent = null;
            document.getElementById('auth-overlay').style.display = 'flex';
        }
    });

    window.signInAgent = async () => {
        try { await signInWithPopup(auth, provider); } 
        catch (error) { alert("Login failed: " + error.message); }
    };

    window.signOutAgent = async () => {
        await signOut(auth);
    };

    // --- Dispatch Logic ---
    window.processWalkInOrder = async () => {
        const btn = document.getElementById('dispatch-btn');
        
        // 1. Gather form data
        const senderName = document.getElementById('sender-name').value;
        const senderPhone = document.getElementById('sender-phone').value;
        const receiverName = document.getElementById('receiver-name').value;
        const receiverPhone = document.getElementById('receiver-phone').value;
        const deliveryAddress = document.getElementById('delivery-address').value;
        const originBranch = document.getElementById('origin-branch').value;
        const paymentMethod = document.getElementById('payment-method').value;
        
        const packageSelect = document.getElementById('package-size').value.split('|');
        const packageName = packageSelect[0];
        const packagePrice = parseInt(packageSelect[1]);

        if(!senderName || !receiverName || !deliveryAddress) {
            alert("Please fill in all required fields.");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';

        const orderId = "CG-WALK-" + Math.floor(1000 + Math.random() * 9000);

        const payload = {
            orderNumber: orderId,
            userId: currentAgent.uid, // Tagged to the agent that processed it
            customerName: receiverName, // Shipday prioritizes the end-customer
            customerPhoneNumber: receiverPhone,
            customerAddress: deliveryAddress,
            restaurantName: `Sender: ${senderName} (${originBranch})`, // Using restaurant name field to store sender/branch context
            restaurantPhoneNumber: senderPhone,
            restaurantAddress: originBranch, // The physical walk-in center
            orderItem: [{ name: packageName, unitPrice: packagePrice, quantity: 1 }],
            totalOrderCost: packagePrice, // Distance calculation can be added via Mapbox API if needed
            paymentMethod: paymentMethod,
            status: 'placed',
            source: 'agent_dashboard',
            timestamp: Date.now()
        };

        try {
            // 2. Save to Firebase RTDB
            await set(push(ref(database, 'orders')), payload);

            // 3. Push to Shipday API
            const sdRes = await fetch("https://api.shipday.com/orders", {
                method: "POST",
                headers: {
                    "Authorization": `Basic ${SHIPDAY_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!sdRes.ok) throw new Error("Shipday Dispatch Failed: " + sdRes.status);

            alert(`Success! Order ${orderId} has been dispatched.`);
            
            // Clear form
            document.querySelectorAll('input[type="text"], input[type="tel"], input[type="email"]').forEach(i => i.value = '');
            document.getElementById('origin-branch').value = "CourierGo Pretoria Branch"; // Reset static value

        } catch (error) {
            console.error(error);
            alert(error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Dispatch to Shipday';
        }
    };
</script>
</body>
</html>
