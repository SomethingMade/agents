<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourierGo | Agent Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Core Layout & Typography */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #fafafa; color: #18181b; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #09090b; color: #fff; display: flex; flex-direction: column; padding: 32px 24px; }
        .brand { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; margin-bottom: 48px; letter-spacing: -0.5px; }
        .brand i { color: #3b82f6; }
        .nav-item { padding: 14px 16px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; color: #a1a1aa; }
        .nav-item.active { background: #18181b; color: #fff; border-left: 3px solid #3b82f6; }
        .nav-item:hover:not(.active) { background: #18181b; color: #fff; }
        
        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 48px; background: #f4f4f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: #09090b; }
        
        /* Card UI */
        .card { background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); border: 1px solid #f4f4f5; margin-bottom: 24px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 24px; color: #09090b; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: #3b82f6; font-size: 18px; }
        
        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { padding: 14px 16px; border: 1.5px solid #e4e4e7; border-radius: 12px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif; transition: all 0.2s ease; background: #fff; color: #18181b; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .form-control:disabled { background: #f4f4f5; color: #71717a; cursor: not-allowed; }
        
        /* Submit Button */
        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35); }
        .btn-submit:active { transform: translateY(1px); }
        .btn-submit:disabled { background: #a1a1aa; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Auth Overlay */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-box { text-align: center; max-width: 320px; }

        /* ============ Global Loading Overlay ============ */
        #loading-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(9, 9, 11, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center; justify-content: center;
        }
        #loading-overlay.active { display: flex; }
        .loading-box {
            background: #fff; border-radius: 20px; padding: 36px 44px;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            min-width: 240px;
        }
        .spinner {
            width: 42px; height: 42px; border-radius: 50%;
            border: 4px solid #e4e4e7; border-top-color: #3b82f6;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; font-weight: 700; color: #18181b; letter-spacing: -0.2px; }
        .loading-subtext { font-size: 12px; font-weight: 500; color: #a1a1aa; }

        /* ============ Custom Result Modal ============ */
        #result-modal-overlay {
            position: fixed; inset: 0; z-index: 2100;
            background: rgba(9, 9, 11, 0.55);
            display: none;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        #result-modal-overlay.active { display: flex; }
        .result-modal {
            background: #fff; border-radius: 24px; padding: 40px 32px 32px;
            max-width: 380px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.92); opacity: 0;
            animation: modalPop 0.22s ease forwards;
        }
        @keyframes modalPop { to { transform: scale(1); opacity: 1; } }
        .result-icon {
            width: 72px; height: 72px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 30px;
        }
        .result-icon.success { background: #dcfce7; color: #16a34a; }
        .result-icon.error { background: #fee2e2; color: #dc2626; }
        .result-title { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 10px; color: #09090b; }
        .result-message { font-size: 14px; color: #71717a; line-height: 1.55; margin-bottom: 28px; }
        .result-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
            color: #fff;
        }
        .result-btn.success { background: #16a34a; }
        .result-btn.success:hover { background: #15803d; }
        .result-btn.error { background: #18181b; }
        .result-btn.error:hover { background: #27272a; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <div style="font-size: 48px; margin-bottom: 24px; color: #18181b;"><i class="fa-solid fa-user-shield"></i></div>
        <h2 style="margin-bottom: 12px; font-weight: 800; letter-spacing: -0.5px;">Agent Portal</h2>
        <p style="color: #71717a; font-size: 15px; margin-bottom: 32px;">Please sign in with your authorized agent account to continue.</p>
        <button onclick="signInAgent()" style="width: 100%; padding: 16px; background: #18181b; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s;">
            <i class="fa-brands fa-google" style="margin-right: 8px;"></i> Sign in with Google
        </button>
    </div>
</div>

<!-- Global Loading Overlay -->
<div id="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Loading...</div>
        <div class="loading-subtext" id="loading-subtext"></div>
    </div>
</div>

<!-- Custom Result Modal (Success / Error) -->
<div id="result-modal-overlay">
    <div class="result-modal">
        <div class="result-icon" id="result-icon"><i class="fa-solid fa-check"></i></div>
        <div class="result-title" id="result-title">Title</div>
        <div class="result-message" id="result-message">Message</div>
        <button class="result-btn" id="result-btn" onclick="closeResultModal()">OK</button>
    </div>
</div>

<div class="sidebar">
    <div class="brand"><i class="fa-solid fa-truck-fast"></i> CourierGo</div>
    <div class="nav-item active"><i class="fa-solid fa-layer-group"></i> Walk-in Dispatch</div>
    <div class="nav-item"><i class="fa-solid fa-clipboard-list"></i> Daily Log</div>
    <div style="margin-top: auto;" class="nav-item" onclick="signOutAgent()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</div>
</div>

<div class="main-content">
    <div class="header">
        <h1>New Dispatch Order</h1>
        <div id="agent-info" style="font-size: 14px; font-weight: 600; color: #71717a; background: #e4e4e7; padding: 8px 16px; border-radius: 20px;">
            <i class="fa-solid fa-user-circle" style="margin-right: 6px;"></i> Loading...
        </div>
    </div>

    <!-- Dispatch Route Configuration -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-route"></i> 1. Route Configuration</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Origin Branch (Drop-off Location)</label>
                <select id="origin-branch" class="form-control">
                    <option value="The Office ( Town )">The Office ( Town )</option>
                    <option value="The Office ( Mahwelereng )">The Office ( Mahwelereng )</option>
                </select>
            </div>
            <div class="form-group">
                <label>Delivery Route Type</label>
                <select id="route-type" class="form-control" onchange="toggleRouteType()">
                    <option value="door">Deliver to Door Address</option>
                    <option value="branch">Branch to Branch Transfer</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Client Details -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-user"></i> 2. Client Details (Sender)</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="sender-name" class="form-control" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="sender-phone" class="form-control" placeholder="060 123 4567">
            </div>
        </div>
    </div>

    <!-- Destination Details -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-location-dot"></i> 3. Destination Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Recipient Name</label>
                <input type="text" id="receiver-name" class="form-control" placeholder="e.g. Jane Smith">
            </div>
            <div class="form-group">
                <label>Recipient Phone</label>
                <input type="tel" id="receiver-phone" class="form-control" placeholder="071 987 6543">
            </div>
            
            <!-- Dynamic Fields Based on Route Type -->
            <div class="form-group" style="grid-column: span 2;" id="group-address">
                <label>Delivery Address</label>
                <input type="text" id="delivery-address" class="form-control" placeholder="Enter full street address for delivery">
            </div>
            
            <div class="form-group" style="grid-column: span 2; display: none;" id="group-branch">
                <label>Destination Branch</label>
                <select id="destination-branch" class="form-control">
                    <option value="The Office ( Mahwelereng )">The Office ( Mahwelereng )</option>
                    <option value="The Office ( Town )">The Office ( Town )</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Package & Payment -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-box"></i> 4. Package & Payment</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Package Size</label>
                <select id="package-size" class="form-control">
                    <option value="Document|40">Document (R40 Base)</option>
                    <option value="Small Parcel|65">Small Parcel (R65 Base)</option>
                    <option value="Medium Box|110">Medium Box (R110 Base)</option>
                    <option value="Large Freight|180">Large Freight (R180 Base)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Payment Collected</label>
                <select id="payment-method" class="form-control">
                    <option value="Counter - Cash">Cash at Counter</option>
                    <option value="Counter - Card">Card Machine at Counter</option>
                </select>
            </div>
        </div>
        
        <div style="margin-top: 32px;">
            <button class="btn-submit" id="dispatch-btn" onclick="processWalkInOrder()">
                <i class="fa-solid fa-paper-plane"></i> Dispatch Order to Shipday
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBQSPwpVbGrdCuOoyitAeWQHIeipj2MgIY",
        authDomain: "newstart-64c43.firebaseapp.com",
        databaseURL: "https://newstart-64c43-default-rtdb.firebaseio.com",
        projectId: "newstart-64c43",
        storageBucket: "newstart-64c43.firebasestorage.app",
        messagingSenderId: "941619830061",
        appId: "1:941619830061:web:de9e0f791eb8f6eacf87a4"
    };

    const SHIPDAY_KEY = "K5a8wQJF3f.az2zfrhgzwxK9JONI2y8";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentAgent = null;

    // ============ Loading Overlay Helpers ============
    window.showLoading = (text = "Loading...", subtext = "") => {
        document.getElementById('loading-text').textContent = text;
        document.getElementById('loading-subtext').textContent = subtext;
        document.getElementById('loading-overlay').classList.add('active');
    };
    window.hideLoading = () => {
        document.getElementById('loading-overlay').classList.remove('active');
    };

    // ============ Result Modal Helpers ============
    window.showResultModal = (type, title, message) => {
        const icon = document.getElementById('result-icon');
        const btn = document.getElementById('result-btn');
        icon.className = 'result-icon ' + type;
        icon.innerHTML = type === 'success' ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-exclamation"></i>';
        btn.className = 'result-btn ' + type;
        document.getElementById('result-title').textContent = title;
        document.getElementById('result-message').textContent = message;
        document.getElementById('result-modal-overlay').classList.add('active');
    };
    window.closeResultModal = () => {
        document.getElementById('result-modal-overlay').classList.remove('active');
    };

    // UI Toggle Logic
    window.toggleRouteType = () => {
        const type = document.getElementById('route-type').value;
        const addressGroup = document.getElementById('group-address');
        const branchGroup = document.getElementById('group-branch');
        
        if (type === 'door') {
            addressGroup.style.display = 'flex';
            branchGroup.style.display = 'none';
        } else {
            addressGroup.style.display = 'none';
            branchGroup.style.display = 'flex';
        }
    };

    // Authentication Logic
    onAuthStateChanged(auth, (user) => {
        hideLoading();
        if (user) {
            currentAgent = user;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('agent-info').innerHTML = `<i class="fa-solid fa-user-circle" style="margin-right: 6px;"></i> ${user.displayName}`;
        } else {
            currentAgent = null;
            document.getElementById('auth-overlay').style.display = 'flex';
        }
    });

    window.signInAgent = async () => {
        showLoading("Signing in...", "Connecting to your Google account");
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            hideLoading();
            showResultModal('error', 'Sign-In Failed', error.message);
        }
    };

    window.signOutAgent = async () => {
        showLoading("Signing out...");
        await signOut(auth);
        hideLoading();
    };

    // Dispatch Logic
    window.processWalkInOrder = async () => {
        const btn = document.getElementById('dispatch-btn');
        
        // 1. Gather Data
        const routeType = document.getElementById('route-type').value;
        const originBranch = document.getElementById('origin-branch').value;
        const senderName = document.getElementById('sender-name').value;
        const senderPhone = document.getElementById('sender-phone').value;
        
        const receiverName = document.getElementById('receiver-name').value;
        const receiverPhone = document.getElementById('receiver-phone').value;
        
        // Determine final destination address string
        const finalDestination = routeType === 'door' 
            ? document.getElementById('delivery-address').value 
            : document.getElementById('destination-branch').value;
            
        const paymentMethod = document.getElementById('payment-method').value;
        
        const packageSelect = document.getElementById('package-size').value.split('|');
        const packageName = packageSelect[0];
        const packagePrice = parseInt(packageSelect[1]);

        if(!senderName || !receiverName || !finalDestination) {
            showResultModal('error', 'Missing Information', 'Please fill in all required fields to dispatch this order.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing Dispatch...';
        showLoading("Saving order...", "Writing record to Firebase");

        const orderId = "CG-WALK-" + Math.floor(1000 + Math.random() * 9000);

        const payload = {
            orderNumber: orderId,
            userId: currentAgent.uid, 
            customerName: receiverName, 
            customerPhoneNumber: receiverPhone,
            customerAddress: finalDestination, 
            restaurantName: `Sender: ${senderName}`, 
            restaurantPhoneNumber: senderPhone,
            restaurantAddress: originBranch, // Pick-up location maps to the origin branch
            orderItem: [{ name: packageName, unitPrice: packagePrice, quantity: 1 }],
            totalOrderCost: packagePrice, 
            paymentMethod: paymentMethod,
            status: 'placed',
            source: 'agent_dashboard',
            timestamp: Date.now()
        };

        try {
            // Save to Firebase RTDB
            await set(push(ref(database, 'orders')), payload);

            // Push to Shipday API
            showLoading("Dispatching to driver network...", "Sending order to Shipday");
            const sdRes = await fetch("https://api.shipday.com/orders", {
                method: "POST",
                headers: {
                    "Authorization": `Basic ${SHIPDAY_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!sdRes.ok) throw new Error("Shipday Dispatch Failed: " + sdRes.status);

            hideLoading();
            showResultModal('success', 'Order Dispatched', `Order ${orderId} has been securely dispatched and is now visible to drivers.`);
            
            // Clear text/tel fields
            document.querySelectorAll('input[type="text"], input[type="tel"]').forEach(i => i.value = '');

        } catch (error) {
            console.error(error);
            hideLoading();
            showResultModal('error', 'Dispatch Failed', error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Dispatch Order to Shipday';
        }
    };
</script>
</body>
</html>
